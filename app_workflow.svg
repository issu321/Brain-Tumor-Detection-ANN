  <text x="600" y="58" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Public Pages • No Auth Required</text>

  <!-- Arrow Landing -> Public Pages -->
  <line x1="120" y1="100" x2="120" y2="60" x2="530" y2="45" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#ma)"/>
  <circle cx="325" cy="52" r="3" fill="#fff" opacity="0.5" filter="url(#gl)"/>

  <!-- Arrow Public Pages -> Landing (dashed) -->
  <line x1="670" y1="45" x2="950" y2="45" x2="950" y2="100" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#ma)"/>

  <!-- Info Panels -->
  <rect x="50" y="420" width="260" height="140" fill="rgba(255,255,255,0.03)" rx="12" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="180" y="450" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">🎨 UI Features</text>
  <text x="180" y="470" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Glassmorphism • Animations</text>
  <text x="180" y="485" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Responsive • Dark Mode</text>
  <text x="180" y="500" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Confidence Rings • Charts</text>
  <text x="180" y="515" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Real-time Analytics</text>
  <text x="180" y="530" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Drag &amp; Drop Upload</text>
  <text x="180" y="545" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Interactive Data Viz</text>

  <rect x="330" y="420" width="260" height="140" fill="rgba(255,255,255,0.03)" rx="12" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="460" y="450" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">🔒 Security</text>
  <text x="460" y="470" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">CSRF Protection</text>
  <text x="460" y="485" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Password Hashing (Werkzeug)</text>
  <text x="460" y="500" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Session Management</text>
  <text x="460" y="515" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Role-Based Access Control</text>
  <text x="460" y="530" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">XSS &amp; SQL Injection Safe</text>
  <text x="460" y="545" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Secure File Uploads</text>

  <rect x="610" y="420" width="260" height="140" fill="rgba(255,255,255,0.03)" rx="12" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="740" y="450" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">🧠 AI Pipeline</text>
  <text x="740" y="470" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Image Preprocessing</text>
  <text x="740" y="485" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">ANN Forward Pass</text>
  <text x="740" y="500" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Softmax Classification</text>
  <text x="740" y="515" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Simulation Mode Fallback</text>
  <text x="740" y="530" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">4-Class Tumor Detection</text>
  <text x="740" y="545" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Confidence Scoring</text>

  <rect x="890" y="420" width="260" height="140" fill="rgba(255,255,255,0.03)" rx="12" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="1020" y="450" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">💾 Data Management</text>
  <text x="1020" y="470" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">SQLite / PostgreSQL</text>
  <text x="1020" y="485" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">SQLAlchemy ORM</text>
  <text x="1020" y="500" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Scan History Pagination</text>
  <text x="1020" y="515" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">User Profiles &amp; Avatars</text>
  <text x="1020" y="530" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Contact Form Storage</text>
  <text x="1020" y="545" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Admin Message Center</text>
</svg>