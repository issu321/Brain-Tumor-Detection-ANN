<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="100%">
  <defs>
    <linearGradient id="aw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="aw-start" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="aw-auth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="aw-dash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="aw-upload" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#db2777"/>
    </linearGradient>
    <linearGradient id="aw-result" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="aw-admin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <filter id="aw-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="aw-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .aw-box { rx: 24; ry: 24; filter: url(#aw-shadow); }
      .aw-text { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: white; text-anchor: middle; font-size: 15px; }
      .aw-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: rgba(255,255,255,0.9); text-anchor: middle; }
      .aw-line { stroke: rgba(255,255,255,0.25); stroke-width: 2.5; fill: none; }

      @keyframes aw-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes aw-pulse-ring {
        0% { r: 8; opacity: 1; }
        100% { r: 20; opacity: 0; }
      }

      .aw-s1 { animation: aw-float 3.5s ease-in-out infinite; }
      .aw-s2 { animation: aw-float 3.5s ease-in-out infinite 0.4s; }
      .aw-s3 { animation: aw-float 3.5s ease-in-out infinite 0.8s; }
      .aw-s4 { animation: aw-float 3.5s ease-in-out infinite 1.2s; }
      .aw-s5 { animation: aw-float 3.5s ease-in-out infinite 1.6s; }
      .aw-s6 { animation: aw-float 3.5s ease-in-out infinite 2s; }
      .aw-s7 { animation: aw-float 3.5s ease-in-out infinite 2.4s; }

      .pulse-ring { animation: aw-pulse-ring 2s ease-out infinite; }
    </style>
    <marker id="aw-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="rgba(255,255,255,0.5)"/>
    </marker>
  </defs>

  <rect width="1200" height="550" fill="url(#aw-bg)" rx="16"/>

  <!-- Title -->
  <text x="600" y="45" class="aw-text" font-size="22" fill="#fff" filter="url(#aw-glow)">🗺️ User Journey & Application Workflow</text>

  <!-- Start -->
  <rect x="50" y="100" width="140" height="90" fill="url(#aw-start)" class="aw-box aw-s1" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="120" y="135" class="aw-text">🚀 Landing</text>
  <text x="120" y="155" class="aw-sub">Home Page</text>
  <text x="120" y="170" class="aw-sub" font-size="9">Glassmorphism UI</text>

  <!-- Arrow -->
  <path d="M 190 145 L 250 145" class="aw-line" marker-end="url(#aw-arrow)"/>
  <circle r="5" fill="#fff" filter="url(#aw-glow)">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 190 145 L 250 145"/>
  </circle>

  <!-- Auth -->
  <rect x="250" y="100" width="140" height="90" fill="url(#aw-auth)" class="aw-box aw-s2" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="320" y="135" class="aw-text">🔐 Auth</text>
  <text x="320" y="155" class="aw-sub">Login / Register</text>
  <text x="320" y="170" class="aw-sub" font-size="9">Flask-Login • WTForms</text>

  <!-- Arrow -->
  <path d="M 390 145 L 450 145" class="aw-line" marker-end="url(#aw-arrow)"/>
  <circle r="5" fill="#fff" filter="url(#aw-glow)">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 390 145 L 450 145"/>
  </circle>

  <!-- Dashboard -->
  <rect x="450" y="100" width="140" height="90" fill="url(#aw-dash)" class="aw-box aw-s3" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="520" y="135" class="aw-text">📊 Dashboard</text>
  <text x="520" y="155" class="aw-sub">Stats & Charts</text>
  <text x="520" y="170" class="aw-sub" font-size="9">Chart.js • Real-time</text>

  <!-- Arrow -->
  <path d="M 590 145 L 650 145" class="aw-line" marker-end="url(#aw-arrow)"/>
  <circle r="5" fill="#fff" filter="url(#aw-glow)">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 590 145 L 650 145"/>
  </circle>

  <!-- Upload -->
  <rect x="650" y="100" width="140" height="90" fill="url(#aw-upload)" class="aw-box aw-s4" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="720" y="135" class="aw-text">📤 Upload</text>
  <text x="720" y="155" class="aw-sub">MRI Scan</text>
  <text x="720" y="170" class="aw-sub" font-size="9">Drag & Drop • Preview</text>

  <!-- Arrow -->
  <path d="M 790 145 L 850 145" class="aw-line" marker-end="url(#aw-arrow)"/>
  <circle r="5" fill="#fff" filter="url(#aw-glow)">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 790 145 L 850 145"/>
  </circle>

  <!-- Result -->
  <rect x="850" y="100" width="140" height="90" fill="url(#aw-result)" class="aw-box aw-s5" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="920" y="135" class="aw-text">🎯 Result</text>
  <text x="920" y="155" class="aw-sub">Prediction + Confidence</text>
  <text x="920" y="170" class="aw-sub" font-size="9">Probability Rings • Charts</text>

  <!-- Branching down -->
  <path d="M 920 190 L 920 240" class="aw-line" marker-end="url(#aw-arrow)"/>
  <circle r="5" fill="#fff" filter="url(#aw-glow)">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 920 190 L 920 240"/>
  </circle>

  <!-- History -->
  <rect x="800" y="250" width="140" height="90" fill="url(#aw-dash)" class="aw-box aw-s6" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="870" y="285" class="aw-text">📜 History</text>
  <text x="870" y="305" class="aw-sub">Scan Records</text>
  <text x="870" y="320" class="aw-sub" font-size="9">Pagination • Search • Filter</text>

  <!-- Arrow back to dashboard -->
  <path d="M 800 295 L 520 295 L 520 190" class="aw-line" stroke-dasharray="6,4" marker-end="url(#aw-arrow)"/>
  <circle r="5" fill="#fff" filter="url(#aw-glow)">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 800 295 L 520 295 L 520 190"/>
  </circle>

  <!-- Profile -->
  <rect x="450" y="250" width="140" height="90" fill="url(#aw-start)" class="aw-box aw-s7" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="520" y="285" class="aw-text">👤 Profile</text>
  <text x="520" y="305" class="aw-sub">Edit Account</text>
  <text x="520" y="320" class="aw-sub" font-size="9">Avatar • Password • Info</text>

  <!-- Arrow to profile -->
  <path d="M 520 190 L 520 250" class="aw-line" stroke-dasharray="6,4" marker-end="url(#aw-arrow)"/>
  <circle r="5" fill="#fff" filter="url(#aw-glow)">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 520 190 L 520 250"/>
  </circle>

  <!-- Admin Branch -->
  <path d="M 320 190 L 320 350 L 200 350" class="aw-line" stroke-dasharray="6,4" marker-end="url(#aw-arrow)"/>
  <circle r="5" fill="#fff" filter="url(#aw-glow)">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M 320 190 L 320 350 L 200 350"/>
  </circle>

  <!-- Admin Panel -->
  <rect x="50" y="305" width="150" height="90" fill="url(#aw-admin)" class="aw-box aw-s1" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="125" y="340" class="aw-text">🛡️ Admin</text>
  <text x="125" y="360" class="aw-sub">User Management</text>
  <text x="125" y="375" class="aw-sub" font-size="9">System Stats • Messages</text>

  <!-- Contact / About branches -->
  <path d="M 120 100 L 120 60 L 600 60 L 600 100" class="aw-line" stroke-dasharray="4,4" marker-end="url(#aw-arrow)"/>
  <circle r="4" fill="#fff" filter="url(#aw-glow)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 120 100 L 120 60 L 600 60 L 600 100"/>
  </circle>

  <rect x="530" y="20" width="140" height="50" fill="rgba(255,255,255,0.08)" rx="12" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="600" y="42" class="aw-text" font-size="12" fill="#94a3b8">ℹ️ About / 📧 Contact</text>
  <text x="600" y="58" class="aw-sub" font-size="9" fill="#94a3b8">Public Pages • No Auth Required</text>

  <!-- Legend / Info -->
  <rect x="50" y="420" width="1100" height="110" fill="rgba(255,255,255,0.03)" rx="12" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <text x="100" y="450" class="aw-text" font-size="13" fill="#94a3b8">🎨 UI Features</text>
  <text x="100" y="470" class="aw-sub" font-size="10" fill="#64748b">Glassmorphism • Animations</text>
  <text x="100" y="485" class="aw-sub" font-size="10" fill="#64748b">Responsive • Dark Mode</text>
  <text x="100" y="500" class="aw-sub" font-size="10" fill="#64748b">Confidence Rings • Charts</text>
  <text x="100" y="515" class="aw-sub" font-size="10" fill="#64748b">Real-time Analytics</text>

  <text x="350" y="450" class="aw-text" font-size="13" fill="#94a3b8">🔒 Security</text>
  <text x="350" y="470" class="aw-sub" font-size="10" fill="#64748b">CSRF Protection</text>
  <text x="350" y="485" class="aw-sub" font-size="10" fill="#64748b">Password Hashing (Werkzeug)</text>
  <text x="350" y="500" class="aw-sub" font-size="10" fill="#64748b">Session Management</text>
  <text x="350" y="515" class="aw-sub" font-size="10" fill="#64748b">Role-Based Access Control</text>

  <text x="600" y="450" class="aw-text" font-size="13" fill="#94a3b8">🧠 AI Pipeline</text>
  <text x="600" y="470" class="aw-sub" font-size="10" fill="#64748b">Image Preprocessing</text>
  <text x="600" y="485" class="aw-sub" font-size="10" fill="#64748b">ANN Forward Pass</text>
  <text x="600" y="500" class="aw-sub" font-size="10" fill="#64748b">Softmax Classification</text>
  <text x="600" y="515" class="aw-sub" font-size="10" fill="#64748b">Simulation Mode Fallback</text>

  <text x="850" y="450" class="aw-text" font-size="13" fill="#94a3b8">💾 Data Management</text>
  <text x="850" y="470" class="aw-sub" font-size="10" fill="#64748b">SQLite / PostgreSQL</text>
  <text x="850" y="485" class="aw-sub" font-size="10" fill="#64748b">SQLAlchemy ORM</text>
  <text x="850" y="500" class="aw-sub" font-size="10" fill="#64748b">Scan History Pagination</text>
  <text x="850" y="515" class="aw-sub" font-size="10" fill="#64748b">User Profiles & Avatars</text>
</svg>