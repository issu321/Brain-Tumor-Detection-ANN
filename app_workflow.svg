  <circle cx="500" cy="215" r="4" fill="#fff" filter="url(#gl)"/>

  <!-- Profile -->
  <rect x="430" y="250" width="140" height="90" fill="url(#c1)" rx="24" filter="url(#sh)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
