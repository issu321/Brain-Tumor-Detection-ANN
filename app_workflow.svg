<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="c1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="c2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="c3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="c4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="c5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="c6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="c7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="gl" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="ma" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="rgba(255,255,255,0.5)"/>
    </marker>
  </defs>

  <rect width="1200" height="580" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="600" y="42" font-family="Segoe UI,system-ui,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle" filter="url(#gl)">🗺️ User Journey &amp; Application Workflow</text>

  <!-- Start: Landing -->
  <rect x="50" y="100" width="140" height="90" fill="url(#c1)" rx="24" filter="url(#sh)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="120" y="135" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">🚀 Landing</text>
  <text x="120" y="155" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.9)" text-anchor="middle">Home Page</text>
  <text x="120" y="170" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.7)" text-anchor="middle">Glassmorphism UI</text>

  <!-- Arrow Landing -> Auth -->
  <line x1="190" y1="145" x2="240" y2="145" stroke="rgba(255,255,255,0.3)" stroke-width="2.5" marker-end="url(#ma)"/>
  <circle cx="215" cy="145" r="4" fill="#fff" filter="url(#gl)"/>

  <!-- Auth -->
  <rect x="240" y="100" width="140" height="90" fill="url(#c2)" rx="24" filter="url(#sh)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="310" y="135" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">🔐 Auth</text>
  <text x="310" y="155" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.9)" text-anchor="middle">Login / Register</text>
  <text x="310" y="170" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.7)" text-anchor="middle">Flask-Login • WTForms</text>

  <!-- Arrow Auth -> Dashboard -->
  <line x1="380" y1="145" x2="430" y2="145" stroke="rgba(255,255,255,0.3)" stroke-width="2.5" marker-end="url(#ma)"/>
  <circle cx="405" cy="145" r="4" fill="#fff" filter="url(#gl)"/>

  <!-- Dashboard -->
  <rect x="430" y="100" width="140" height="90" fill="url(#c3)" rx="24" filter="url(#sh)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="500" y="135" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">📊 Dashboard</text>
  <text x="500" y="155" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.9)" text-anchor="middle">Stats &amp; Charts</text>
  <text x="500" y="170" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.7)" text-anchor="middle">Chart.js • Real-time</text>

  <!-- Arrow Dashboard -> Upload -->
  <line x1="570" y1="145" x2="620" y2="145" stroke="rgba(255,255,255,0.3)" stroke-width="2.5" marker-end="url(#ma)"/>
  <circle cx="595" cy="145" r="4" fill="#fff" filter="url(#gl)"/>

  <!-- Upload -->
  <rect x="620" y="100" width="140" height="90" fill="url(#c4)" rx="24" filter="url(#sh)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="690" y="135" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">📤 Upload</text>
  <text x="690" y="155" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.9)" text-anchor="middle">MRI Scan</text>
  <text x="690" y="170" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.7)" text-anchor="middle">Drag &amp; Drop • Preview</text>

  <!-- Arrow Upload -> Result -->
  <line x1="760" y1="145" x2="810" y2="145" stroke="rgba(255,255,255,0.3)" stroke-width="2.5" marker-end="url(#ma)"/>
  <circle cx="785" cy="145" r="4" fill="#fff" filter="url(#gl)"/>

  <!-- Result -->
  <rect x="810" y="100" width="140" height="90" fill="url(#c5)" rx="24" filter="url(#sh)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="880" y="135" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">🎯 Result</text>
  <text x="880" y="155" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.9)" text-anchor="middle">Prediction + Confidence</text>
  <text x="880" y="170" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.7)" text-anchor="middle">Probability Rings • Charts</text>

  <!-- Arrow Result -> History -->
  <line x1="880" y1="190" x2="880" y2="240" stroke="rgba(255,255,255,0.3)" stroke-width="2.5" marker-end="url(#ma)"/>
  <circle cx="880" cy="215" r="4" fill="#fff" filter="url(#gl)"/>

  <!-- History -->
  <rect x="800" y="250" width="160" height="90" fill="url(#c3)" rx="24" filter="url(#sh)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="880" y="285" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">📜 History</text>
  <text x="880" y="305" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.9)" text-anchor="middle">Scan Records</text>
  <text x="880" y="320" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.7)" text-anchor="middle">Pagination • Search • Filter</text>

