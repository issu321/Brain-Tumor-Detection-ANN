  <text x="500" y="305" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.9)" text-anchor="middle">Edit Account</text>
  <text x="500" y="320" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.7)" text-anchor="middle">Avatar • Password • Info</text>

