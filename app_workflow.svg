  <text x="125" y="360" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.9)" text-anchor="middle">User Management</text>
  <text x="125" y="375" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.7)" text-anchor="middle">System Stats • Messages</text>

