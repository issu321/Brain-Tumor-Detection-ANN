<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .neuron { fill: url(#grad1); stroke: #fff; stroke-width: 2; filter: url(#glow); }
      .neuron-h1 { fill: url(#grad2); stroke: #fff; stroke-width: 2; filter: url(#glow); }
      .neuron-h2 { fill: url(#grad3); stroke: #fff; stroke-width: 2; filter: url(#glow); }
      .neuron-out { fill: url(#grad4); stroke: #fff; stroke-width: 2; filter: url(#glow); }
      .connection { stroke: rgba(255,255,255,0.15); stroke-width: 1; }
      .signal { fill: #fff; filter: url(#glow); }
      .label { font-family: 'Segoe UI', sans-serif; font-size: 14px; fill: #fff; font-weight: 600; text-anchor: middle; }
      .layer-label { font-family: 'Segoe UI', sans-serif; font-size: 16px; fill: #a0aec0; font-weight: 700; text-anchor: middle; }
      .class-label { font-family: 'Segoe UI', sans-serif; font-size: 12px; fill: #fff; font-weight: 500; text-anchor: middle; }

      @keyframes pulse {
        0%, 100% { r: 18; opacity: 1; }
        50% { r: 22; opacity: 0.8; }
      }
      @keyframes signal-flow {
        0% { opacity: 0; transform: translate(0, 0); }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes glow-pulse {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.8; }
      }

      .neuron, .neuron-h1, .neuron-h2, .neuron-out { animation: pulse 3s ease-in-out infinite; }
      .sig1 { animation: signal-flow 2s linear infinite; animation-delay: 0s; }
      .sig2 { animation: signal-flow 2s linear infinite; animation-delay: 0.4s; }
      .sig3 { animation: signal-flow 2s linear infinite; animation-delay: 0.8s; }
      .sig4 { animation: signal-flow 2s linear infinite; animation-delay: 1.2s; }
      .sig5 { animation: signal-flow 2s linear infinite; animation-delay: 1.6s; }
    </style>
  </defs>

  <rect width="900" height="500" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="450" y="40" class="layer-label" font-size="22" fill="#fff">🧠 ANN Architecture for Brain Tumor Classification</text>

  <!-- Input Layer (Image) -->
  <text x="100" y="80" class="layer-label">Input Layer</text>
  <text x="100" y="100" class="label" font-size="11" fill="#94a3b8">MRI Scan Image</text>
  <text x="100" y="115" class="label" font-size="11" fill="#94a3b8">224×224×3</text>

  <!-- Input Neurons -->
  <circle cx="100" cy="160" r="18" class="neuron" style="animation-delay:0s"/>
  <circle cx="100" cy="220" r="18" class="neuron" style="animation-delay:0.2s"/>
  <circle cx="100" cy="280" r="18" class="neuron" style="animation-delay:0.4s"/>
  <circle cx="100" cy="340" r="18" class="neuron" style="animation-delay:0.6s"/>
  <circle cx="100" cy="400" r="18" class="neuron" style="animation-delay:0.8s"/>

  <!-- Hidden Layer 1 -->
  <text x="300" y="80" class="layer-label">Hidden Layer 1</text>
  <text x="300" y="100" class="label" font-size="11" fill="#94a3b8">512 Neurons</text>
  <text x="300" y="115" class="label" font-size="11" fill="#94a3b8">ReLU Activation</text>

  <circle cx="300" cy="145" r="16" class="neuron-h1" style="animation-delay:0.1s"/>
  <circle cx="300" cy="190" r="16" class="neuron-h1" style="animation-delay:0.3s"/>
  <circle cx="300" cy="235" r="16" class="neuron-h1" style="animation-delay:0.5s"/>
  <circle cx="300" cy="280" r="16" class="neuron-h1" style="animation-delay:0.7s"/>
  <circle cx="300" cy="325" r="16" class="neuron-h1" style="animation-delay:0.9s"/>
  <circle cx="300" cy="370" r="16" class="neuron-h1" style="animation-delay:1.1s"/>
  <circle cx="300" cy="415" r="16" class="neuron-h1" style="animation-delay:1.3s"/>

  <!-- Hidden Layer 2 -->
  <text x="500" y="80" class="layer-label">Hidden Layer 2</text>
  <text x="500" y="100" class="label" font-size="11" fill="#94a3b8">256 Neurons</text>
  <text x="500" y="115" class="label" font-size="11" fill="#94a3b8">ReLU + Dropout</text>

  <circle cx="500" cy="160" r="16" class="neuron-h2" style="animation-delay:0.15s"/>
  <circle cx="500" cy="210" r="16" class="neuron-h2" style="animation-delay:0.35s"/>
  <circle cx="500" cy="260" r="16" class="neuron-h2" style="animation-delay:0.55s"/>
  <circle cx="500" cy="310" r="16" class="neuron-h2" style="animation-delay:0.75s"/>
  <circle cx="500" cy="360" r="16" class="neuron-h2" style="animation-delay:0.95s"/>
  <circle cx="500" cy="410" r="16" class="neuron-h2" style="animation-delay:1.15s"/>

  <!-- Output Layer -->
  <text x="750" y="80" class="layer-label">Output Layer</text>
  <text x="750" y="100" class="label" font-size="11" fill="#94a3b8">Softmax</text>
  <text x="750" y="115" class="label" font-size="11" fill="#94a3b8">4 Classes</text>

  <circle cx="750" cy="190" r="20" class="neuron-out" style="animation-delay:0.2s"/>
  <circle cx="750" cy="260" r="20" class="neuron-out" style="animation-delay:0.4s"/>
  <circle cx="750" cy="330" r="20" class="neuron-out" style="animation-delay:0.6s"/>
  <circle cx="750" cy="400" r="20" class="neuron-out" style="animation-delay:0.8s"/>

  <!-- Class Labels -->
  <text x="790" y="195" class="class-label" text-anchor="start">🟢 No Tumor</text>
  <text x="790" y="265" class="class-label" text-anchor="start">🔴 Glioma</text>
  <text x="790" y="335" class="class-label" text-anchor="start">🟡 Meningioma</text>
  <text x="790" y="405" class="class-label" text-anchor="start">🔵 Pituitary</text>

