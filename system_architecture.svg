<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="uiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#db2777"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .box { rx: 16; ry: 16; filter: url(#shadow); }
      .text { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: white; text-anchor: middle; }
      .subtext { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: rgba(255,255,255,0.8); text-anchor: middle; }
      .arrow { stroke: rgba(255,255,255,0.4); stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .packet { fill: #fff; filter: url(#glow2); }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes flow1 {
        0% { offset-distance: 0%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }
      @keyframes flow2 {
        0% { offset-distance: 0%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }
      @keyframes pulse-box {
        0%, 100% { stroke: rgba(255,255,255,0.2); stroke-width: 2; }
        50% { stroke: rgba(255,255,255,0.6); stroke-width: 3; }
      }

      .user-box { animation: float 4s ease-in-out infinite, pulse-box 3s ease-in-out infinite; }
      .flask-box { animation: float 4s ease-in-out infinite 0.5s, pulse-box 3s ease-in-out infinite 0.5s; }
      .db-box { animation: float 4s ease-in-out infinite 1s, pulse-box 3s ease-in-out infinite 1s; }
      .ai-box { animation: float 4s ease-in-out infinite 1.5s, pulse-box 3s ease-in-out infinite 1.5s; }
      .ui-box { animation: float 4s ease-in-out infinite 2s, pulse-box 3s ease-in-out infinite 2s; }

      .pk1 { animation: flow1 3s linear infinite; }
      .pk2 { animation: flow1 3s linear infinite 0.6s; }
      .pk3 { animation: flow1 3s linear infinite 1.2s; }
      .pk4 { animation: flow2 3s linear infinite 0.3s; }
      .pk5 { animation: flow2 3s linear infinite 0.9s; }
      .pk6 { animation: flow2 3s linear infinite 1.5s; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="rgba(255,255,255,0.4)"/>
    </marker>
  </defs>

  <rect width="1000" height="600" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="500" y="45" class="text" font-size="24" fill="#fff" filter="url(#glow2)">🏗️ System Architecture Overview</text>

  <!-- User Layer -->
  <rect x="420" y="80" width="160" height="70" fill="url(#userGrad)" class="box user-box" stroke="rgba(255,255,255,0.3)"/>
  <text x="500" y="115" class="text" font-size="16">👤 User</text>
  <text x="500" y="135" class="subtext">Web Browser / Mobile</text>

  <!-- Arrow User -> UI -->
  <path id="path1" d="M 500 150 L 500 190" stroke="rgba(255,255,255,0.3)" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle r="5" class="packet pk1">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 500 150 L 500 190"/>
  </circle>

  <!-- UI Layer -->
  <rect x="320" y="200" width="360" height="80" fill="url(#uiGrad)" class="box ui-box" stroke="rgba(255,255,255,0.3)"/>
  <text x="500" y="235" class="text" font-size="16">🎨 Glassmorphism UI</text>
  <text x="500" y="255" class="subtext">HTML5 • CSS3 • Bootstrap 5 • Chart.js • Font Awesome</text>
  <text x="500" y="270" class="subtext" font-size="10">Responsive • Animated • Interactive</text>

  <!-- Arrow UI -> Flask -->
  <path id="path2" d="M 500 280 L 500 320" stroke="rgba(255,255,255,0.3)" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle r="5" class="packet pk2">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 500 280 L 500 320"/>
  </circle>

  <!-- Flask Backend -->
  <rect x="280" y="330" width="440" height="100" fill="url(#flaskGrad)" class="box flask-box" stroke="rgba(255,255,255,0.3)"/>
  <text x="500" y="365" class="text" font-size="16">⚡ Flask Backend</text>
  <text x="500" y="385" class="subtext">Flask 3.1 • SQLAlchemy • Flask-Login • Flask-WTF • Werkzeug</text>
  <text x="500" y="400" class="subtext" font-size="10">REST API • Authentication • Session Management • File Handling</text>
  <text x="500" y="415" class="subtext" font-size="10">Routes: /login /register /upload /dashboard /admin /api</text>

  <!-- Arrow Flask -> DB -->
  <path id="path3a" d="M 350 430 L 180 480" stroke="rgba(255,255,255,0.3)" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle r="5" class="packet pk3">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 350 430 L 180 480"/>
  </circle>

  <!-- Arrow Flask -> AI -->
  <path id="path3b" d="M 650 430 L 820 480" stroke="rgba(255,255,255,0.3)" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle r="5" class="packet pk4">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 650 430 L 820 480"/>
  </circle>

  <!-- Database Layer -->
  <rect x="50" y="480" width="260" height="90" fill="url(#dbGrad)" class="box db-box" stroke="rgba(255,255,255,0.3)"/>
  <text x="180" y="515" class="text" font-size="16">🗄️ Database Layer</text>
  <text x="180" y="535" class="subtext">SQLite (default) / PostgreSQL / MySQL</text>
  <text x="180" y="550" class="subtext" font-size="10">Users • Scans • History • Contacts • Admin Data</text>
  <text x="180" y="562" class="subtext" font-size="10">SQLAlchemy ORM • Migrations • Relationships</text>

  <!-- AI/ML Layer -->
  <rect x="690" y="480" width="260" height="90" fill="url(#aiGrad)" class="box ai-box" stroke="rgba(255,255,255,0.3)"/>
  <text x="820" y="515" class="text" font-size="16">🧠 AI / ML Engine</text>
  <text x="820" y="535" class="subtext">TensorFlow 2.18+ • Keras • NumPy • Pillow</text>
  <text x="820" y="550" class="subtext" font-size="10">ANN Model • Image Preprocessing • Prediction</text>
  <text x="820" y="562" class="subtext" font-size="10">4-Class Classification • Confidence Analysis</text>

  <!-- Return arrows -->
  <path d="M 180 480 L 350 430" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <path d="M 820 480 L 650 430" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <path d="M 500 320 L 500 280" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>

  <!-- Legend -->
  <rect x="30" y="30" width="200" height="35" fill="rgba(255,255,255,0.05)" rx="8"/>
  <text x="130" y="52" class="subtext" font-size="11">➡️ Request Flow  ⬅️ Response Flow</text>
</svg>